<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><title>MyCompany</title>
<!-- The stamp is generated at LOAD time, not baked in at deploy time. GitHub Pages serves
     this file with Cache-Control: max-age=600, so a baked-in stamp meant a cached index
     kept redirecting to a cached page - the preview looked stale even when the server had
     the new build. Date.now() makes every visit a URL the browser has never seen. -->
<script>location.replace('website-redesign/homepage-morning.html?b=' + Date.now());</script>
<noscript><meta http-equiv="refresh" content="0; url=website-redesign/homepage-morning.html"></noscript>
</head><body><a href="website-redesign/homepage-morning.html">MyCompany</a></body></html>
